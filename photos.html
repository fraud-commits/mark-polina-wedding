<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ec">
<title>Фотографии · Mark & Polina</title>
<style>
  :root{--sienna:#8b937c;--bg:#f7f4ec;--ink:#2b2f26;--muted:#6d7360;--line:#d9d8ca}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 Georgia,serif;min-height:100vh;
       padding:calc(18px + env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}
  header{display:flex;align-items:center;justify-content:space-between;max-width:640px;margin:0 auto 26px;
         padding-bottom:14px;border-bottom:1px solid var(--line)}
  .mono{font-size:15px;letter-spacing:.06em}.mono i{font-style:oblique;color:var(--sienna)}
  .lang{font:inherit;border:0;background:none;color:var(--ink);cursor:pointer;
        text-decoration:underline;text-underline-offset:3px;letter-spacing:.06em}
  main{max-width:640px;margin:0 auto}
  .eyebrow{font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);
           text-align:center;margin:0 0 10px}
  h1{font-size:clamp(30px,8.5vw,44px);line-height:1.1;text-align:center;margin:0 0 8px;font-weight:400}
  .who{text-align:center;color:var(--sienna);font-style:italic;min-height:24px;margin:0 0 26px}
  .shot{display:flex;flex-direction:column;align-items:center;gap:14px;margin:0 0 22px}
  .shutter{width:86px;height:86px;border-radius:50%;border:1.5px solid var(--ink);background:var(--bg);
           cursor:pointer;display:flex;align-items:center;justify-content:center;
           font-size:34px;color:var(--ink);transition:transform .15s ease}
  .shutter:active{transform:scale(.94)}
  .caption{font-size:13px;color:var(--muted);text-align:center}
  input[type=file]{display:none}
  .note{text-align:center;font-size:12.5px;color:var(--muted);margin:18px auto;max-width:430px}
  .state{max-width:430px;margin:22px auto 0;border-top:1px solid var(--line);padding-top:16px}
  .row{display:flex;justify-content:space-between;font-size:13.5px;margin:6px 0}
  .row b{font-weight:400;color:var(--muted)}
  button.retry{font:inherit;font-size:13px;border:1px solid var(--line);background:none;
               border-radius:999px;padding:7px 16px;cursor:pointer;margin-top:8px}
  button.retry:disabled{opacity:.4;cursor:default}
  .ok{color:var(--sienna)}
  .preview{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px}
  .preview img{width:64px;height:64px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
  footer{text-align:center;font-size:11px;letter-spacing:.08em;color:var(--muted);
         margin-top:34px;text-transform:uppercase}
  footer a{color:inherit}
</style>
</head>
<body>
<header>
  <div class="mono">M <i>&</i> P</div>
  <button class="lang" id="langBtn" type="button">EN</button>
</header>
<main>
  <p class="eyebrow" data-t="eyebrow">26 · 06 · 2027 · Dunduriņi</p>
  <h1 data-t="title">Фотографии гостей</h1>
  <p class="who" id="who"></p>

  <div class="shot">
    <button class="shutter" id="shutter" type="button" aria-label="Сфотографировать">📷</button>
    <input type="file" id="file" accept="image/*" multiple>
    <p class="caption" data-t="tap">Нажмите — камера откроется прямо здесь.<br>Можно выбрать и уже снятые фото.</p>
  </div>

  <p class="note" data-t="note">Снимки попадают в общий альбом молодожёнов и появляются в гостевой ленте сразу.</p>

  <div class="state">
    <div class="row"><b data-t="sent">Отправлено сегодня:</b><span class="ok" id="sent">0</span></div>
    <div class="row"><b data-t="pending">В очереди:</b><span id="pend">0</span></div>
    <button class="retry" id="retry" type="button" data-t="retry" disabled>Отпавить очередь</button>
    <div class="preview" id="prev"></div>
  </div>
</main>
<footer>
  <a href="index.html" data-t="back">← На сайт приглашения</a>
</footer>

<script src="guests.js?v=1"></script>
<script>
(function(){
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyn64wnJ5r-0DEipCFbVmOcTYS6eJ29TVerSUhYf2t1YxZGR4Yh_HB397xxsBynWjB3/exec';
  const $ = s => document.querySelector(s);
  const token = new URLSearchParams(location.search).get('g') || 'default';
  const g = WEDDING_GUESTS[token] || WEDDING_GUESTS['default'];
  const AUTO_EN = window.WEDDING_AUTO_EN || {};
  const lang = (AUTO_EN[token] || new URLSearchParams(location.search).get('lang') === 'en') ? 'en' : 'ru';
  const myName = g[lang].join(' · ');

  const T = {
    ru: { eyebrow:'26 · 06 · 2027 · Dunduriņi', title:'Фотографии гостей', tap:'Нажмите — камера откроется прямо здесь.<br>Можно выбрать и уже снятые фото.',
          note:'Снимки попадают в общий альбом молодожёнов и появляются в гостевой ленте сразу.',
          sent:'Отправлено:', pending:'В очереди:', retry:'Отправить очередь', back:'← На сайт приглашения',
          whoPrefix:'Делится с нами: ', hello:'Здравствуйте!' },
    en: { eyebrow:'26 · 06 · 2027 · Dunduriņi', title:'Guest photo wall', tap:'Tap once — the camera opens here.<br>Already-shot photos work too.',
          note:'Every shot goes straight into the couple’s shared album and the guest feed.',
          sent:'Uploaded:', pending:'In queue:', retry:'Send the queue', back:'← Back to the invitation site',
          whoPrefix:'Sharing with us: ', hello:'Hello!' }
  };

  let queue = [];   // {blob, previewURL}
  let sent = 0;

  function t(key){ return T[lang][key]; }

  function applyLang(){
    document.documentElement.lang = lang;
    $('#langBtn').textContent = lang === 'en' ? 'RU' : 'EN';
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = t(el.dataset.t); });
    $('#who').textContent = t('whoPrefix') + myName;
    $('#langBtn').onclick = () => { location.search = '?g=' + token + (lang === 'en' ? '' : '&lang=en'); };
  }

  function counters(){
    $('#sent').textContent = sent;
    $('#pend').textContent = queue.length;
    $('#retry').disabled = queue.length === 0;
    $('#prev').innerHTML = queue.map(q => '<img alt="" src="' + q.url + '">').join('');
  }

  // Сжимаем до 2048px по длинной стороне, JPEG 0.85 — снимок укладывается в ~1.5 МБ.
  function compress(blob){
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const max = 2048, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => res(b), 'image/jpeg', .85);
        URL.revokeObjectURL(img.src);
      };
      img.src = URL.createObjectURL(blob);
    });
  }

  async function sendOne(item){
    const base64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(item.blob); });
    const res = await fetch(SCRIPT_URL, { method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ token: token, name: myName, data: base64 }) });
    const j = await res.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.error || 'no ok');
  }

  async function drain(){
    while (queue.length && SCRIPT_URL.indexOf('script.google.com') === 0) {
      const item = queue[0];
      try { await sendOne(item); queue.shift(); sent++;
            localStorage.removeItem('ph-queue');
      } catch(e) { localStorage.setItem('ph-queue', '1'); break; }
      counters();
    }
    if (queue.length) localStorage.setItem('ph-queue', '1');
    else if (sent) localStorage.removeItem('ph-queue');
  }

  function addFiles(files){
    for (const f of Array.from(files || []).slice(0, 12)) {
      if (!f.type.startsWith('image/')) continue;
      compress(f).then(blob => { queue.push({ blob: blob, url: URL.createObjectURL(blob) });
                                 counters(); drain(); });
    }
  }

  $('#shutter').onclick = () => $('#file').click();
  $('#file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('#retry').onclick = drain;

  applyLang();
  counters();
  if (localStorage.getItem('ph-queue') === '1') drain();

  addEventListener('online', drain);
})();
</script>
</body>
</html>
