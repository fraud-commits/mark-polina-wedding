<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf8f1">
<title>Фотографии · Mark & Polina</title>
<style>
  @import url("https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400&display=swap");
  :root{--paper:#faf8f1;--olive:#46503c;--muted:#747763;--line:#dedccf;--sage:#8b9278}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--paper);color:var(--olive);
       font:300 15.5px/1.85 Manrope,Arial,sans-serif;
       padding:max(16px,env(safe-area-inset-top)) 18px max(28px,env(safe-area-inset-bottom))}
  /* точечная текстура бумаги — как на сайте-приглашении */
  body:before{content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
       background-image:radial-gradient(#b3aa9018 .65px,transparent .65px);background-size:5px 5px}

  /* стрельчатая арка, вписывающая всё содержимое */
  .arch{max-width:520px;margin:26px auto 0;position:relative;overflow:hidden;
        border:1px solid #c8cbb87a;border-radius:48% 48% 0 0;border-bottom:0;
        padding:44px 30px 34px;min-height:calc(100vh - 90px)}
  .arch:after{content:'';position:absolute;inset:9px;border:1px solid #c8cbb83d;
        border-radius:inherit;border-bottom:0;pointer-events:none}
  .calla{position:absolute;right:-34px;bottom:0;width:clamp(96px,26vw,150px);
         opacity:.85;pointer-events:none;transform:rotate(-4deg);filter:drop-shadow(-4px 6px 7px rgba(87,75,40,.10))}

  header{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;
         margin:-8px -6px 18px}
  .mono{font-family:'Cormorant Garamond',Georgia,serif;font-size:19px}
  .mono i{font-style:oblique;color:var(--sage)}
  .lang{font:inherit;border:0;background:none;color:var(--olive);cursor:pointer;
        text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px}
  .lang:hover{color:var(--sage)}

  .eyebrow{font-size:9px;font-weight:500;letter-spacing:.25em;color:#727861;text-align:center;margin:6px 0 14px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;
     font-size:clamp(38px,10vw,52px);line-height:1.05;letter-spacing:-.03em;
     text-align:center;margin:0 0 10px}
  .who{text-align:center;margin:0 0 30px;font-family:'Cormorant Garamond',Georgia,serif;
       font-style:italic;font-weight:300;font-size:21px;color:var(--sage)}
  .who b{font-weight:400;color:var(--olive)}

  .shot{display:flex;flex-direction:column;align-items:center;gap:16px;position:relative;z-index:2}
  .shutter{position:relative;width:104px;height:104px;border-radius:50%;border:0;background:none;
           cursor:pointer;color:var(--olive);flex:none}
  .shutter::before{content:'';position:absolute;inset:0;border-radius:50%;border:1px solid var(--olive)}
  .shutter::after{content:'';position:absolute;inset:11px;border-radius:50%;
           border:1px solid #c8cbb8;transition:transform .3s ease,border-color .25s ease}
  .shutter svg{position:absolute;inset:0;margin:auto}
  .shutter:hover::after{transform:scale(.94);border-color:var(--olive)}
  .shutter:active::before{transform:scale(.97)}
  @media(hover:hover) and (prefers-reduced-motion:no-preference){
    .shutter::after{animation:hint 3.4s ease-in-out infinite}
    @keyframes hint{0%,100%{transform:scale(1)}50%{transform:scale(.95)}}
  }
  .caption{text-align:center;color:var(--muted);font-size:13px;max-width:280px;margin:0}

  .note{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:300;
        text-align:center;color:var(--muted);font-size:17px;max-width:360px;margin:26px auto 0}

  .latest{margin:38px 0 0;text-align:center}
  .latest .eyebrow{margin-bottom:14px}
  .thumbs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
  .thumbs img{width:86px;height:86px;object-fit:cover;border-radius:8px 8px 3px 3px;
              border:1px solid var(--line);background:#e9ebdf}
  .albumlink{display:inline-block;margin-top:16px;font-size:9.5px;letter-spacing:.22em;
             text-transform:uppercase;color:var(--muted);text-decoration:none;
             border-bottom:1px solid #c8cbb8;padding-bottom:3px}
  .albumlink:hover{color:var(--olive)}

  .state{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;
         margin:30px auto 0;font-size:12.5px;color:var(--muted);position:relative;z-index:2}
  .state .ok{color:var(--sage);font-family:'Cormorant Garamond',Georgia,serif;font-size:17px}
  .retry{font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;border:0;
         background:none;color:var(--olive);cursor:pointer;text-decoration:underline;
         text-decoration-thickness:1px;text-underline-offset:3px}
  .retry:disabled{opacity:.35;cursor:default}
  .preview{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .preview img{width:56px;height:56px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}

  footer{text-align:center;font-size:9px;letter-spacing:.25em;text-transform:uppercase;
         color:#727861;margin-top:34px}
  footer a{color:inherit;text-decoration:none;border-bottom:1px solid #c8cbb8;padding-bottom:2px}

  /* всплывающая благодарность */
  .toast{position:fixed;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translate(-50%,16px);
         background:var(--olive);color:var(--paper);font-family:'Cormorant Garamond',Georgia,serif;
         font-style:italic;font-size:17px;letter-spacing:.02em;padding:12px 26px;border-radius:999px;
         opacity:0;pointer-events:none;transition:opacity .45s ease,transform .45s ease;z-index:9}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="arch">
  <img class="calla" src="hero-calla-reference.png" alt="" aria-hidden="true">
  <header>
    <div class="mono">M <i>&</i> P</div>
    <button class="lang" id="langBtn" type="button">EN</button>
  </header>

  <p class="eyebrow" data-t="eyebrow">26 · 06 · 2027 · Dunduriņi</p>
  <h1 data-t="title">Фотографии</h1>
  <p class="who" id="who"></p>

  <div class="shot">
    <button class="shutter" id="shutter" type="button" aria-label="Сфотографировать">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <rect x="6" y="12" width="28" height="20" rx="3.5" stroke="currentColor" stroke-width="1.2"/>
        <path d="M14 12l2-3.5h8L26 12" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="20" cy="22" r="5.4" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="30.6" cy="15.6" r="1" fill="currentColor"/>
      </svg>
    </button>
    <input type="file" id="file" accept="image/*" multiple>
    <p class="caption" data-t="tap">Нажмите — камера откроется прямо здесь.<br>Можно выбрать и уже снятые фото.</p>
  </div>

  <p class="note" data-t="note">Каждый ваш кадр попадает в наш общий альбом — вместе это будет целая лента воспоминаний.</p>

  <div class="state">
    <span data-t="sent">Отправлено:</span> <span class="ok" id="sent">0</span> ·
    <span data-t="pending">в очереди</span> <span id="pend">0</span>
    <button class="retry" id="retry" type="button" data-t="retry" disabled>Отправить очередь</button>
  </div>
  <div class="preview" id="prev"></div>

  <div class="latest" id="latest">
    <p class="eyebrow" data-t="latest">Уже в альбоме</p>
    <div class="thumbs" id="thumbs"></div>
    <a class="albumlink" id="album" href="#" target="_blank" rel="noopener" data-t="openalbum">Открыть альбом ↗</a>
  </div>
</div>

<footer>
  <a href="index.html" data-t="back">← На сайт приглашения</a>
</footer>
<div class="toast" id="toast"></div>

<script src="guests.js?v=2"></script>
<script>
(function(){
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyn64wnJ5r-0DEipCFbVmOcTYS6eJ29TVerSUhYf2t1YxZGR4Yh_HB397xxsBynWjB3/exec';
  const ALBUM_URL  = 'https://drive.google.com/drive/folders/1l9eiDECOg6U0ZUPkKc43PajX7WNyej0_';
  const $  = s => document.querySelector(s);
  const qs = new URLSearchParams(location.search);
  const token = qs.get('g') || 'default';
  const g = WEDDING_GUESTS[token] || WEDDING_GUESTS['default'];
  const AUTO_EN = (WEDDING_AUTO_EN || {})[token];
  const lang = (AUTO_EN || qs.get('lang') === 'en') ? 'en' : 'ru';
  const whoName = g[lang].join(' · ');

  const T = {
    ru: { whoPrefix:'Делится с нами:', title:'Фотографии',
          tap:'Нажмите — камера откроется прямо здесь.<br>Можно выбрать и уже снятые фото.',
          note:'Каждый ваш кадр попадает в наш общий альбом — вместе это будет целая лента воспоминаний.',
          sent:'Отправлено:', pending:'в очереди', retry:'Отправить очередь',
          latest:'Уже в альбоме', openalbum:'Открыть альбом ↗', back:'← На сайт приглашения',
          toast:'Спасибо! Кадр уже в альбоме ♥' },
    en: { whoPrefix:'Sharing with us:', title:'Guest photo wall',
          tap:'Tap once — the camera opens here.<br>Already-shot photos work too.',
          note:'Every shot joins our shared album — together we’ll build a whole film of memories.',
          sent:'Uploaded:', pending:'in queue', retry:'Send the queue',
          latest:'Already there', openalbum:'Open album ↗', back:'← Back to the invitation',
          toast:'Thank you! It’s in the album ♥' }
  };

  function hail(){
    return lang === 'en'
      ? T.en.whoPrefix + ' <b>' + whoName + '</b>'
      : T.ru.whoPrefix + ' <b>' + whoName + '</b>';
  }

  let queue = [];   // {blob, url}
  let sent = 0;

  function applyLang(){
    document.documentElement.lang = lang;
    $('#langBtn').textContent = lang === 'en' ? 'RU' : 'EN';
    document.querySelectorAll('[data-t]').forEach(el => { el.innerHTML = T[lang][el.dataset.t]; });
    $('#who').innerHTML = hail();
    $('#album').href = ALBUM_URL;
    $('#langBtn').onclick = () => { location.search = '?g=' + token + (lang === 'en' ? '' : '&lang=en'); };
  }

  function counters(){
    $('#sent').textContent = sent;
    $('#pend').textContent = queue.length;
    $('#retry').disabled = queue.length === 0;
    $('#prev').innerHTML = queue.map(q => '<img alt="" src="' + q.url + '">').join('');
  }

  function toast(){
    const t = $('#toast');
    t.textContent = T[lang].toast;
    t.classList.add('on');
    setTimeout(() => t.classList.remove('on'), 2600);
  }

  /* сжатие до 2048px, JPEG .85 */
  function compress(blob){
    return new Promise(res => {
      const img = new Image();
      img.onload = () => {
        const max = 2048, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        c.toBlob(b => { URL.revokeObjectURL(img.src); res(b); }, 'image/jpeg', .85);
      };
      img.src = URL.createObjectURL(blob);
    });
  }

  async function sendOne(item){
    const base64 = await new Promise(r => { const fr = new FileReader();
      fr.onload = () => r(String(fr.result).split(',')[1]); fr.readAsDataURL(item.blob); });
    const res = await fetch(SCRIPT_URL, { method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ token: token, name: whoName, data: base64 }) });
    const j = await res.json().catch(() => ({}));
    if (!j.ok) throw new Error(j.error || 'no ok');
  }

  async function drain(){
    while (queue.length) {
      const item = queue[0];
      try { await sendOne(item); queue.shift(); sent++; toast(); loadLatest(); }
      catch(e) { break; }
      counters();
    }
  }

  function addFiles(files){
    for (const f of Array.from(files || []).slice(0, 12)) {
      if (!f.type.startsWith('image/')) continue;
      compress(f).then(blob => { queue.push({ blob: blob, url: URL.createObjectURL(blob) });
                                 counters(); drain(); });
    }
  }

  /* мини-лента последних фото */
  async function loadLatest(){
    try {
      const j = await (await fetch(SCRIPT_URL + '?action=list&limit=5')).json();
      if (!j.ok || !Array.isArray(j.items)) return;
      $('#thumbs').innerHTML = j.items.map(it =>
        '<img alt="" src="https://drive.google.com/thumbnail?id=' + it.id + '&sz=w400">').join('');
    } catch(e) { /* тихо: лента обновится на следующем тике */ }
  }

  $('#shutter').onclick = () => $('#file').click();
  $('#file').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('#retry').onclick = drain;

  applyLang();
  counters();
  loadLatest();
  setInterval(loadLatest, 20000);
  addEventListener('online', drain);
})();
</script>
</body>
</html>
