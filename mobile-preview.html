<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Проверка мобильной версии</title><style>body{margin:0;background:#e6e4dc;font:14px Arial;text-align:center}p{margin:16px}.sizes{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:14px 0 0}.sizes button{font:13px Arial;padding:7px 14px;border:1px solid #c9c7bd;background:#f4f2ea;color:#424c34;border-radius:20px;cursor:pointer}.sizes button.on{background:#424c34;color:#f8f5ed;border-color:#424c34}iframe{display:block;width:402px;max-width:100%;height:874px;border:0;margin:18px auto 30px;background:#faf8f1;box-shadow:0 10px 40px rgba(0,0,0,.14);border-radius:28px;transition:width .2s,height .2s}</style><p>Мобильная версия</p><div class="sizes"><button data-w="402" data-h="874" class="on">iPhone 17 Pro · 402×874</button><button data-w="440" data-h="956">17 Pro Max · 440×956</button><button data-w="393" data-h="852">iPhone 16/15 · 393×852</button><button data-w="375" data-h="667">SE · 375×667</button></div><iframe id="pv" src="index.html" title="Приглашение на экране телефона"></iframe><script>const f=document.getElementById('pv');document.querySelectorAll('.sizes button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.sizes button').forEach(x=>x.classList.remove('on'));b.classList.add('on');f.style.width=b.dataset.w+'px';f.style.height=b.dataset.h+'px'});</script>
